name: SonarQube Security Pipeline

# This replaces the Jenkins push webhook trigger
on:
  push:
    branches:
      - main

jobs:
  analyze:
    # This routes the job to your Mac instead of GitHub's cloud
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required by SonarQube to analyze Git blame/history
          
      - name: Run SonarQube Scan & Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        # sonar.qualitygate.wait=true replaces the Jenkins webhook callback!
        run: |
          sonar-scanner \
            -Dsonar.projectKey=sonar-scan-learning \
            -Dsonar.sources=. \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.qualitygate.wait=true
